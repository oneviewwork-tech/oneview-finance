name: Keep database warm

# Best-effort only — this does NOT prevent Neon's ~5-minute auto-suspend,
# and shouldn't be relied on to.
#
# GitHub enforces a five-minute floor on scheduled workflows, and even then
# treats the schedule as best-effort, delaying runs under load. Measured on
# this repo: five runs in fourteen hours, gaps of two to six hours. So most
# real visits still land on suspended compute regardless of this workflow.
#
# The cold start it fails to avoid is ~1.7s (2.1s first hit vs ~0.4s warm),
# paid once per idle period, not per request — the app stays warm through an
# active session. If that becomes worth removing, the fix is an external
# pinger that honours a 5-minute interval (UptimeRobot, cron-job.org) or a
# Neon plan where auto-suspend can be disabled. Not this.
on:
  schedule:
    - cron: "*/5 * * * *" # the documented minimum; anything lower is ignored
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS "${{ vars.APP_URL || 'https://oneview-finance.vercel.app' }}/api/health"
