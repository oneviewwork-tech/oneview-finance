name: Keep database warm

# Vercel Hobby-plan cron jobs are capped at once per day, which can't
# prevent Neon's ~5-minute auto-suspend. GitHub Actions has no such
# restriction, so it pings the app's /api/health endpoint on a schedule
# instead — that endpoint runs one trivial query, which is enough to keep
# Neon's compute from suspending between real visits.
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS "${{ vars.APP_URL || 'https://oneview-finance.vercel.app' }}/api/health"
